name: avalonia

on:
  push:
    branches: [avalonia, main]
    paths:
      - "avalonia/**"
      - "docs/parity-matrix.md"
      - "docs/packaging/**"
      - "docs/fixtures/ui/**"
      - "docs/fixtures/phase0/**"
      - "docs/fixtures/phase1/**"
      - "docs/superpowers/specs/2026-10-19-comtool-avalonia-parallel-design.md"
      - "docs/superpowers/plans/2026-10-19-comtool-avalonia-phase0-*.md"
      - "docs/superpowers/plans/2026-10-19-comtool-avalonia-phase1-*.md"
  pull_request:
    paths:
      - "avalonia/**"
      - "docs/parity-matrix.md"
      - "docs/packaging/**"
      - "docs/fixtures/ui/**"
      - "docs/fixtures/phase0/**"
      - "docs/fixtures/phase1/**"
      - "docs/superpowers/specs/2026-10-19-comtool-avalonia-parallel-design.md"
      - "docs/superpowers/plans/2026-10-19-comtool-avalonia-phase0-*.md"
      - "docs/superpowers/plans/2026-10-19-comtool-avalonia-phase1-*.md"
  workflow_dispatch:

jobs:
  build:
    name: build and test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore avalonia/COMTool.Avalonia.sln

      - name: Build
        run: dotnet build avalonia/COMTool.Avalonia.sln -c Release --no-restore

      - name: Test
        run: dotnet test avalonia/COMTool.Avalonia.sln -c Release --no-build

      - name: Test real lrzsz transfers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y lrzsz
          LRZSZ_DIR=/usr/bin dotnet test \
            avalonia/tests/COMTool.Connections.Tests/COMTool.Connections.Tests.csproj \
            -c Release --no-build --filter FullyQualifiedName~LrzszZmodemTests

  publish-windows:
    name: publish windows x64
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish self-contained
        run: >
          dotnet publish avalonia/src/COMTool.App/COMTool.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None -p:DebugSymbols=false
          -o avalonia/publish/win-x64

      - name: Validate installer scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem avalonia/pack/windows/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error "$($_.Name): $($errors[0].Message)"
            }
          }
          if ($failed) { exit 1 }

      - name: Package release
        shell: pwsh
        run: ./avalonia/pack/windows/pack.ps1 -SkipPublish

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: comtool-avalonia-beta-win-x64
          path: avalonia/publish/package/

  publish-linux:
    name: publish linux x64
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Validate installer scripts
        run: |
          bash -n avalonia/pack/linux/pack.sh
          bash -n avalonia/pack/linux/install.sh
          bash -n avalonia/pack/linux/uninstall.sh

      - name: Build Linux package
        run: ./avalonia/pack/linux/pack.sh

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: comtool-avalonia-beta-linux-x64
          path: |
            avalonia/publish/package/COMTool-Avalonia-linux-x64-*.tar.gz
            avalonia/publish/package/SHA256SUMS-linux.txt
