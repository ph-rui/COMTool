name: avalonia

on:
  push:
    branches: [avalonia, main]
    paths:
      - "avalonia/**"
      - "docs/parity-matrix.md"
      - "docs/testing/**"
      - "docs/packaging/**"
      - "docs/fixtures/**"
      - "docs/superpowers/specs/2026-10-20-comtool-avalonia-test-gate-design.md"
      - "docs/superpowers/plans/2026-10-20-comtool-avalonia-test-gate.md"
      - ".github/workflows/avalonia.yml"
  pull_request:
    paths:
      - "avalonia/**"
      - "docs/parity-matrix.md"
      - "docs/testing/**"
      - "docs/packaging/**"
      - "docs/fixtures/**"
      - "docs/superpowers/specs/2026-10-20-comtool-avalonia-test-gate-design.md"
      - "docs/superpowers/plans/2026-10-20-comtool-avalonia-test-gate.md"
      - ".github/workflows/avalonia.yml"
  workflow_dispatch:

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Linux E2E dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb xdotool openbox openssh-server lrzsz \
            x11-utils x11-apps imagemagick netcat-openbsd iproute2 procps

      - name: Verify (Linux/macOS)
        if: runner.os != 'Windows'
        run: bash avalonia/pack/verify.sh

      - name: Verify (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./avalonia/pack/verify.ps1

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avalonia-verify-${{ matrix.os }}
          path: avalonia/publish/test-results/**
          if-no-files-found: warn

  publish-windows:
    name: candidate windows x64
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build gated candidate
        shell: pwsh
        run: ./avalonia/pack/windows/pack.ps1

      - name: Upload candidate only
        uses: actions/upload-artifact@v4
        with:
          name: comtool-avalonia-candidate-win-x64
          path: avalonia/publish/candidate/**
          if-no-files-found: error

  publish-linux:
    name: candidate linux x64
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Linux E2E dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb xdotool openbox openssh-server lrzsz \
            x11-utils x11-apps imagemagick netcat-openbsd iproute2 procps

      - name: Build gated candidate
        run: bash avalonia/pack/linux/pack.sh

      - name: Upload candidate only
        uses: actions/upload-artifact@v4
        with:
          name: comtool-avalonia-candidate-linux-x64
          path: avalonia/publish/candidate/**
          if-no-files-found: error
